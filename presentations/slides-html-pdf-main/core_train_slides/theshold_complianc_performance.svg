<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa" rx="5" ry="5"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">Expected Compliance-Performance Relationship</text>
  
  <!-- Graph Area -->
  <rect x="100" y="100" width="600" height="300" fill="white" stroke="#95a5a6" stroke-width="1"/>
  
  <!-- Axes -->
  <line x1="100" y1="400" x2="700" y2="400" stroke="#2c3e50" stroke-width="2"/>
  <line x1="100" y1="400" x2="100" y2="100" stroke="#2c3e50" stroke-width="2"/>
  
  <!-- X-axis Labels -->
  <text x="400" y="440" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">Compliance Level</text>
  <text x="150" y="420" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Low</text>
  <text x="400" y="420" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Medium</text>
  <text x="650" y="420" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">High</text>
  
  <!-- Y-axis Labels -->
  <text x="55" y="250" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50" transform="rotate(-90, 55, 250)">Model Performance</text>
  <text x="80" y="380" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#2c3e50">Low</text>
  <text x="80" y="250" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#2c3e50">Medium</text>
  <text x="80" y="120" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#2c3e50">High</text>
  
  <!-- Performance Curves -->
  <!-- General Performance Curve -->
  <path d="M100,120 Q250,150 400,200 T700,350" fill="none" stroke="#3498db" stroke-width="3"/>
  <text x="550" y="280" font-family="Arial, sans-serif" font-size="12" fill="#3498db" font-weight="bold">General Performance</text>
  
  <!-- Cultural Knowledge Curve -->
  <path d="M100,130 Q200,180 300,250 T700,380" fill="none" stroke="#e74c3c" stroke-width="3"/>
  <text x="550" y="350" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c" font-weight="bold">Cultural Knowledge</text>
  
  <!-- Factual Accuracy Curve -->
  <path d="M100,150 Q250,170 450,180 T700,220" fill="none" stroke="#2ecc71" stroke-width="3"/>
  <text x="550" y="200" font-family="Arial, sans-serif" font-size="12" fill="#2ecc71" font-weight="bold">Factual Accuracy</text>
  
  <!-- Critical Thresholds -->
  <line x1="250" y1="100" x2="250" y2="400" stroke="#95a5a6" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="250" y="90" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">First Threshold</text>
  
  <line x1="375" y1="100" x2="375" y2="400" stroke="#95a5a6" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="375" y="90" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">Second Threshold</text>
  
  <line x1="500" y1="100" x2="500" y2="400" stroke="#95a5a6" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="500" y="90" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">Third Threshold</text>
  
  <!-- Annotations -->
  <circle cx="150" cy="130" r="5" fill="#3498db"/>
  <text x="150" y="100" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">High Performance</text>
  <text x="150" y="115" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Low Compliance</text>
  <line x1="150" y1="120" x2="150" y2="125" stroke="#95a5a6" stroke-width="1"/>
  
  <circle cx="650" cy="350" r="5" fill="#3498db"/>
  <text x="650" y="380" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Lower Performance</text>
  <text x="650" y="395" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">High Compliance</text>
  <line x1="650" y1="355" x2="650" y2="370" stroke="#95a5a6" stroke-width="1"/>
  
  <circle cx="350" cy="220" r="5" fill="#3498db"/>
  <text x="365" y="230" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Non-linear Relationship</text>
  <text x="365" y="245" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Steeper Drop At Thresholds</text>
  <line x1="350" y1="225" x2="365" y2="225" stroke="#95a5a6" stroke-width="1"/>
  
  <!-- Legend -->
  <rect x="100" y="450" width="600" height="40" rx="5" ry="5" fill="white" stroke="#95a5a6"/>
  <text x="130" y="475" font-family="Arial, sans-serif" font-size="12" fill="#3498db" font-weight="bold">General Performance</text>
  <text x="300" y="475" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c" font-weight="bold">Cultural Knowledge</text>
  <text x="470" y="475" font-family="Arial, sans-serif" font-size="12" fill="#2ecc71" font-weight="bold">Factual Accuracy</text>
  <text x="620" y="475" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d" font-weight="bold">Thresholds</text>
  
  <line x1="110" y1="475" x2="125" y2="475" stroke="#3498db" stroke-width="3"/>
  <line x1="280" y1="475" x2="295" y2="475" stroke="#e74c3c" stroke-width="3"/>
  <line x1="450" y1="475" x2="465" y2="475" stroke="#2ecc71" stroke-width="3"/>
  <line x1="600" y1="475" x2="615" y2="475" stroke="#7f8c8d" stroke-width="1" stroke-dasharray="5,5"/>
</svg>