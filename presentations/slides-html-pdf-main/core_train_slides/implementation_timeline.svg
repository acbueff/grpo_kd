<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa" rx="5" ry="5"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">Implementation Timeline</text>
  
  <!-- Timeline Base -->
  <line x1="100" y1="250" x2="700" y2="250" stroke="#95a5a6" stroke-width="4"/>
  
  <!-- Time Period Sections -->
  <!-- Current Phase -->
  <rect x="100" y="200" width="100" height="100" rx="5" ry="5" fill="#3498db" opacity="0.3" stroke="#3498db"/>
  <text x="150" y="180" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">Current Phase</text>
  <text x="150" y="195" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Mar-Apr 2025</text>
  
  <!-- Pre-Training Setup -->
  <rect x="200" y="200" width="100" height="100" rx="5" ry="5" fill="#f39c12" opacity="0.3" stroke="#f39c12"/>
  <text x="250" y="180" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">Pre-Training Setup</text>
  <text x="250" y="195" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Apr-Jun 2025</text>
  
  <!-- Training Phase -->
  <rect x="300" y="200" width="200" height="100" rx="5" ry="5" fill="#2ecc71" opacity="0.3" stroke="#2ecc71"/>
  <text x="400" y="180" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">Training Phase</text>
  <text x="400" y="195" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Jun-Oct 2025</text>
  
  <!-- Final Delivery Phase -->
  <rect x="500" y="200" width="200" height="100" rx="5" ry="5" fill="#9b59b6" opacity="0.3" stroke="#9b59b6"/>
  <text x="600" y="180" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">Completion Phase</text>
  <text x="600" y="195" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Oct-Nov 2025</text>
  
  <!-- Key Milestone Markers -->
  <!-- April Meeting -->
  <circle cx="150" cy="250" r="8" fill="#3498db"/>
  <line x1="150" y1="250" x2="150" y2="320" stroke="#3498db" stroke-width="2"/>
  <rect x="90" y="320" width="120" height="50" rx="5" ry="5" fill="white" stroke="#3498db"/>
  <text x="150" y="340" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#2c3e50">Current Meeting</text>
  <text x="150" y="360" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">April 14, 2025</text>
  
  <!-- May Infrastructure -->
  <circle cx="250" cy="250" r="8" fill="#f39c12"/>
  <line x1="250" y1="250" x2="250" y2="320" stroke="#f39c12" stroke-width="2"/>
  <rect x="190" y="320" width="120" height="50" rx="5" ry="5" fill="white" stroke="#f39c12"/>
  <text x="250" y="340" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#2c3e50">Infrastructure Tests</text>
  <text x="250" y="360" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">May 2025</text>
  
  <!-- June Training -->
  <circle cx="320" cy="250" r="12" fill="#e74c3c"/>
  <line x1="320" y1="250" x2="320" y2="380" stroke="#e74c3c" stroke-width="3"/>
  <rect x="260" y="380" width="120" height="50" rx="5" ry="5" fill="white" stroke="#e74c3c"/>
  <text x="320" y="400" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#2c3e50">Training Start</text>
  <text x="320" y="420" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">June 20-30, 2025</text>
  
  <!-- August Evaluation -->
  <circle cx="400" cy="250" r="8" fill="#2ecc71"/>
  <line x1="400" y1="250" x2="400" y2="320" stroke="#2ecc71" stroke-width="2"/>
  <rect x="340" y="320" width="120" height="50" rx="5" ry="5" fill="white" stroke="#2ecc71"/>
  <text x="400" y="340" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#2c3e50">Interim Evaluation</text>
  <text x="400" y="360" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">August 2025</text>
  
  <!-- October Training End -->
  <circle cx="480" cy="250" r="8" fill="#2ecc71"/>
  <line x1="480" y1="250" x2="480" y2="380" stroke="#2ecc71" stroke-width="2"/>
  <rect x="420" y="380" width="120" height="50" rx="5" ry="5" fill="white" stroke="#2ecc71"/>
  <text x="480" y="400" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#2c3e50">Training Complete</text>
  <text x="480" y="420" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">October 2025</text>
  
  <!-- November Delivery -->
  <circle cx="600" cy="250" r="10" fill="#9b59b6"/>
  <line x1="600" y1="250" x2="600" y2="320" stroke="#9b59b6" stroke-width="2"/>
  <rect x="540" y="320" width="120" height="50" rx="5" ry="5" fill="white" stroke="#9b59b6"/>
  <text x="600" y="340" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#2c3e50">Final Delivery</text>
  <text x="600" y="360" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">November 2025</text>
  
  <!-- Timeline Labels (Months/Years) -->
  <line x1="100" y1="250" x2="100" y2="260" stroke="#95a5a6" stroke-width="2"/>
  <text x="100" y="275" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">Mar</text>
  <text x="100" y="290" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">2025</text>
  
  <line x1="200" y1="250" x2="200" y2="260" stroke="#95a5a6" stroke-width="2"/>
  <text x="200" y="275" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">Apr</text>
  <text x="200" y="290" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">2025</text>
  
  <line x1="300" y1="250" x2="300" y2="260" stroke="#95a5a6" stroke-width="2"/>
  <text x="300" y="275" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">Jun</text>
  <text x="300" y="290" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">2025</text>
  
  <line x1="400" y1="250" x2="400" y2="260" stroke="#95a5a6" stroke-width="2"/>
  <text x="400" y="275" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">Aug</text>
  <text x="400" y="290" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">2025</text>
  
  <line x1="500" y1="250" x2="500" y2="260" stroke="#95a5a6" stroke-width="2"/>
  <text x="500" y="275" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">Oct</text>
  <text x="500" y="290" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">2025</text>
  
  <line x1="600" y1="250" x2="600" y2="260" stroke="#95a5a6" stroke-width="2"/>
  <text x="600" y="275" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">Nov</text>
  <text x="600" y="290" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">2025</text>
  
  <line x1="700" y1="250" x2="700" y2="260" stroke="#95a5a6" stroke-width="2"/>
  <text x="700" y="275" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">Dec</text>
  <text x="700" y="290" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">2025</text>
  
  <!-- Key Activities -->
  <text x="150" y="230" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Planning</text>
  <text x="250" y="230" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Infrastructure Setup</text>
  <text x="320" y="230" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Training Launch</text>
  <text x="400" y="230" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Interim Results</text>
  <text x="480" y="230" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Training End</text>
  <text x="600" y="230" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Final Deliverable</text>
</svg> 