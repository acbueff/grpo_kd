<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa" rx="5" ry="5"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">Compliance vs. Performance Study (Leonardo)</text>
  
  <!-- Fixed Model Architecture Box -->
  <rect x="325" y="80" width="150" height="80" rx="10" ry="10" fill="#3498db" opacity="0.9"/>
  <text x="400" y="115" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">100B Parameter</text>
  <text x="400" y="140" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Model Architecture</text>
  
  <!-- Data Input Boxes -->
  <rect x="125" y="210" width="150" height="60" rx="10" ry="10" fill="#e74c3c" opacity="0.9"/>
  <text x="200" y="245" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Minimally Filtered</text>
  <text x="200" y="265" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">(Low Compliance)</text>
  
  <rect x="325" y="210" width="150" height="60" rx="10" ry="10" fill="#f39c12" opacity="0.9"/>
  <text x="400" y="245" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Moderately Filtered</text>
  <text x="400" y="265" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">(Medium Compliance)</text>
  
  <rect x="525" y="210" width="150" height="60" rx="10" ry="10" fill="#2ecc71" opacity="0.9"/>
  <text x="600" y="245" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Highly Filtered</text>
  <text x="600" y="265" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">(High Compliance)</text>
  
  <!-- Connecting Lines -->
  <line x1="200" y1="210" x2="370" y2="160" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="400" y1="210" x2="400" y2="160" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="600" y1="210" x2="430" y2="160" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Output Boxes -->
  <rect x="125" y="320" width="150" height="60" rx="10" ry="10" fill="#3498db" opacity="0.7"/>
  <text x="200" y="350" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Model Variant A</text>
  <text x="200" y="370" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">(Performance A)</text>
  
  <rect x="325" y="320" width="150" height="60" rx="10" ry="10" fill="#3498db" opacity="0.7"/>
  <text x="400" y="350" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Model Variant B</text>
  <text x="400" y="370" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">(Performance B)</text>
  
  <rect x="525" y="320" width="150" height="60" rx="10" ry="10" fill="#3498db" opacity="0.7"/>
  <text x="600" y="350" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Model Variant C</text>
  <text x="600" y="370" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">(Performance C)</text>
  
  <!-- More Connecting Lines -->
  <line x1="200" y1="270" x2="200" y2="320" stroke="#7f8c8d" stroke-width="2"/>
  <line x1="400" y1="270" x2="400" y2="320" stroke="#7f8c8d" stroke-width="2"/>
  <line x1="600" y1="270" x2="600" y2="320" stroke="#7f8c8d" stroke-width="2"/>
  
  <!-- Control Variables Box -->
  <rect x="50" y="410" width="700" height="60" rx="10" ry="10" fill="#95a5a6" opacity="0.3"/>
  <text x="400" y="440" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">Control Variables: Architecture, Hyperparameters, Training Steps, Evaluation Methodology</text>
  
  <!-- Legend -->
  <rect x="30" y="80" width="200" height="100" rx="5" ry="5" fill="white" stroke="#95a5a6"/>
  <text x="130" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">Key Research Question</text>
  <text x="130" y="125" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">How do different levels of</text>
  <text x="130" y="145" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">data compliance affect</text>
  <text x="130" y="165" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">model capabilities?</text>
</svg>