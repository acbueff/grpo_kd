<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background and gradients -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ds-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6a11cb;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#2575fc;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="our-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#20bf55;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#01baef;stop-opacity:0.8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="url(#bg-gradient)" />
  
  <!-- Title -->
  <text x="500" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">Performance Comparison: Our Approach vs DeepSeek V3</text>
  
  <!-- Legend -->
  <rect x="350" y="60" width="20" height="20" fill="url(#ds-gradient)" />
  <text x="380" y="76" font-family="Arial, sans-serif" font-size="16" fill="#333">DeepSeek V3</text>
  
  <rect x="500" y="60" width="20" height="20" fill="url(#our-gradient)" />
  <text x="530" y="76" font-family="Arial, sans-serif" font-size="16" fill="#333">Our Approach (Target)</text>

  <!-- Horizontal metrics comparison charts -->
  <!-- Training Compute -->
  <text x="120" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">Training Compute</text>
  <text x="120" y="150" font-family="Arial, sans-serif" font-size="14" fill="#666">(GPU hours per trillion tokens)</text>
  
  <rect x="120" y="160" width="730" height="50" fill="#f1f3f5" rx="5" ry="5" stroke="#ddd" stroke-width="1" />
  <rect x="120" y="160" width="520" height="25" fill="url(#ds-gradient)" rx="5" ry="5" />
  <rect x="120" y="185" width="420" height="25" fill="url(#our-gradient)" rx="5" ry="5" />
  
  <text x="650" y="177" font-family="Arial, sans-serif" font-size="14" fill="#333">180K GPU hours (DeepSeek V3)</text>
  <text x="550" y="202" font-family="Arial, sans-serif" font-size="14" fill="#333">~150K GPU hours (Target)</text>

  <!-- Total Parameters -->
  <text x="120" y="230" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">Total Model Size</text>
  <text x="120" y="250" font-family="Arial, sans-serif" font-size="14" fill="#666">(Total parameters)</text>
  
  <rect x="120" y="260" width="730" height="50" fill="#f1f3f5" rx="5" ry="5" stroke="#ddd" stroke-width="1" />
  <rect x="120" y="260" width="630" height="25" fill="url(#ds-gradient)" rx="5" ry="5" />
  <rect x="120" y="285" width="630" height="25" fill="url(#our-gradient)" rx="5" ry="5" />
  
  <text x="760" y="277" font-family="Arial, sans-serif" font-size="14" fill="#333">671B parameters (DeepSeek V3)</text>
  <text x="760" y="302" font-family="Arial, sans-serif" font-size="14" fill="#333">~670B parameters (Target)</text>

  <!-- Activated Parameters -->
  <text x="120" y="330" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">Activated Parameters</text>
  <text x="120" y="350" font-family="Arial, sans-serif" font-size="14" fill="#666">(Parameters per token)</text>
  
  <rect x="120" y="360" width="730" height="50" fill="#f1f3f5" rx="5" ry="5" stroke="#ddd" stroke-width="1" />
  <rect x="120" y="360" width="320" height="25" fill="url(#ds-gradient)" rx="5" ry="5" />
  <rect x="120" y="385" width="270" height="25" fill="url(#our-gradient)" rx="5" ry="5" />
  
  <text x="450" y="377" font-family="Arial, sans-serif" font-size="14" fill="#333">37B parameters (DeepSeek V3)</text>
  <text x="400" y="402" font-family="Arial, sans-serif" font-size="14" fill="#333">~30B parameters (Target)</text>

  <!-- Performance Metrics -->
  <text x="120" y="430" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">Model Performance</text>
  <text x="120" y="450" font-family="Arial, sans-serif" font-size="14" fill="#666">(Selected benchmark metrics)</text>
  
  <rect x="120" y="460" width="730" height="100" fill="#f1f3f5" rx="5" ry="5" stroke="#ddd" stroke-width="1" />
  
  <!-- MMLU Score -->
  <text x="130" y="480" font-family="Arial, sans-serif" font-size="14" fill="#333">MMLU:</text>
  <rect x="180" y="470" width="140" height="16" fill="url(#ds-gradient)" rx="3" ry="3" />
  <rect x="180" y="490" width="140" height="16" fill="url(#our-gradient)" rx="3" ry="3" />
  <text x="330" y="480" font-family="Arial, sans-serif" font-size="12" fill="#333">87.1% (DeepSeek V3)</text>
  <text x="330" y="500" font-family="Arial, sans-serif" font-size="12" fill="#333">~87% (Target)</text>
  
  <!-- Math Benchmark -->
  <text x="450" y="480" font-family="Arial, sans-serif" font-size="14" fill="#333">MATH-500:</text>
  <rect x="530" y="470" width="180" height="16" fill="url(#ds-gradient)" rx="3" ry="3" />
  <rect x="530" y="490" width="190" height="16" fill="url(#our-gradient)" rx="3" ry="3" />
  <text x="720" y="480" font-family="Arial, sans-serif" font-size="12" fill="#333">90.2% (DeepSeek V3)</text>
  <text x="730" y="500" font-family="Arial, sans-serif" font-size="12" fill="#333">~92% (Target)</text>
  
  <!-- Coding Benchmark -->
  <text x="130" y="530" font-family="Arial, sans-serif" font-size="14" fill="#333">Codeforces:</text>
  <rect x="210" y="520" width="103" height="16" fill="url(#ds-gradient)" rx="3" ry="3" />
  <rect x="210" y="540" width="120" height="16" fill="url(#our-gradient)" rx="3" ry="3" />
  <text x="323" y="530" font-family="Arial, sans-serif" font-size="12" fill="#333">51.6% (DeepSeek V3)</text>
  <text x="340" y="550" font-family="Arial, sans-serif" font-size="12" fill="#333">~55% (Target)</text>
  
  <!-- EU Compliance Score -->
  <text x="450" y="530" font-family="Arial, sans-serif" font-size="14" fill="#333">EU Compliance Score:</text>
  <rect x="600" y="520" width="60" height="16" fill="url(#ds-gradient)" rx="3" ry="3" />
  <rect x="600" y="540" width="120" height="16" fill="url(#our-gradient)" rx="3" ry="3" />
  <text x="670" y="530" font-family="Arial, sans-serif" font-size="12" fill="#333">N/A (DeepSeek V3)</text>
  <text x="730" y="550" font-family="Arial, sans-serif" font-size="12" fill="#333">Compliant (Target)</text>

  <!-- Removed Key Innovations Box for better layout -->
  
  <!-- Annotations -->
  <text x="820" y="135" font-family="Arial, sans-serif" font-size="14" fill="#333" font-style="italic">15-20% reduction in</text>
  <text x="820" y="155" font-family="Arial, sans-serif" font-size="14" fill="#333" font-style="italic">compute requirements</text>
  <line x1="800" y1="145" x2="750" y2="185" stroke="#666" stroke-width="1" stroke-dasharray="3,2" />
  
  <text x="820" y="235" font-family="Arial, sans-serif" font-size="14" fill="#333" font-style="italic">Similar total size but</text>
  <text x="820" y="255" font-family="Arial, sans-serif" font-size="14" fill="#333" font-style="italic">more efficient architecture</text>
  <line x1="800" y1="245" x2="750" y2="285" stroke="#666" stroke-width="1" stroke-dasharray="3,2" />
  
  <text x="820" y="335" font-family="Arial, sans-serif" font-size="14" fill="#333" font-style="italic">Reduced activation with</text>
  <text x="820" y="355" font-family="Arial, sans-serif" font-size="14" fill="#333" font-style="italic">improved BitNet routing</text>
  <line x1="800" y1="345" x2="400" y2="385" stroke="#666" stroke-width="1" stroke-dasharray="3,2" />
  
  <text x="815" y="435" font-family="Arial, sans-serif" font-size="14" fill="#333" font-style="italic">Comparable or better performance</text>
  <text x="815" y="455" font-family="Arial, sans-serif" font-size="14" fill="#333" font-style="italic">with EU compliance built-in</text>
  <line x1="795" y1="445" x2="750" y2="490" stroke="#666" stroke-width="1" stroke-dasharray="3,2" />
  
  <!-- Footer -->
  <text x="500" y="580" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">TrustLLM Training Project - Jupiter HPC Research</text>
</svg>
