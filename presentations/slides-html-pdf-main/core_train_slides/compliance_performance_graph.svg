<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa" rx="5" ry="5"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">Balancing Compliance and Data Utility</text>
  
  <!-- Graph Area -->
  <rect x="100" y="100" width="600" height="300" fill="white" stroke="#95a5a6" stroke-width="1"/>
  
  <!-- Axes -->
  <line x1="100" y1="400" x2="700" y2="400" stroke="#2c3e50" stroke-width="2"/>
  <line x1="100" y1="400" x2="100" y2="100" stroke="#2c3e50" stroke-width="2"/>
  
  <!-- X-axis Labels -->
  <text x="400" y="440" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">Filtering Intensity</text>
  <text x="150" y="420" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Minimal</text>
  <text x="400" y="420" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Moderate</text>
  <text x="650" y="420" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Aggressive</text>
  
  <!-- Y-axis Labels -->
  <text x="55" y="250" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50" transform="rotate(-90, 55, 250)">Model Performance</text>
  <text x="80" y="380" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#2c3e50">Low</text>
  <text x="80" y="250" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#2c3e50">Medium</text>
  <text x="80" y="120" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#2c3e50">High</text>
  
  <!-- Performance Curves -->
  <!-- General Performance Curve -->
  <path d="M100,120 Q250,150 400,200 T700,350" fill="none" stroke="#3498db" stroke-width="3"/>
  <text x="550" y="280" font-family="Arial, sans-serif" font-size="12" fill="#3498db" font-weight="bold">General Performance</text>
  
  <!-- Linguistic Diversity Curve -->
  <path d="M100,130 Q200,180 300,250 T700,380" fill="none" stroke="#e74c3c" stroke-width="3"/>
  <text x="550" y="350" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c" font-weight="bold">Linguistic Diversity</text>
  
  <!-- Technical Knowledge Curve -->
  <path d="M100,150 Q250,170 450,180 T700,220" fill="none" stroke="#2ecc71" stroke-width="3"/>
  <text x="550" y="200" font-family="Arial, sans-serif" font-size="12" fill="#2ecc71" font-weight="bold">Technical Knowledge</text>
  
  <!-- Critical Thresholds -->
  <line x1="250" y1="100" x2="250" y2="400" stroke="#95a5a6" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="250" y="90" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">PII Threshold</text>
  
  <line x1="500" y1="100" x2="500" y2="400" stroke="#95a5a6" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="500" y="90" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">Entity Threshold</text>
  
  <!-- Optimal Region -->
  <rect x="250" y="150" width="250" height="100" fill="#3498db" fill-opacity="0.1" stroke="#3498db" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="375" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#3498db">Optimal Region</text>
  <text x="375" y="190" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#3498db">Balance of Compliance and Performance</text>
  
  <!-- Annotations -->
  <circle cx="150" cy="130" r="5" fill="#3498db"/>
  <text x="150" y="100" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">High Performance</text>
  <text x="150" y="115" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Low Compliance</text>
  <line x1="150" y1="120" x2="150" y2="125" stroke="#95a5a6" stroke-width="1"/>
  
  <circle cx="650" cy="350" r="5" fill="#3498db"/>
  <text x="650" y="380" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Lower Performance</text>
  <text x="650" y="395" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">High Compliance</text>
  <line x1="650" y1="355" x2="650" y2="370" stroke="#95a5a6" stroke-width="1"/>
  
  <!-- Target Points for Each Model Variant -->
  <circle cx="200" cy="140" r="7" fill="#e74c3c"/>
  <text x="200" y="130" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">A</text>
  
  <circle cx="375" cy="200" r="7" fill="#3498db"/>
  <text x="375" y="190" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">B</text>
  
  <circle cx="550" cy="300" r="7" fill="#2ecc71"/>
  <text x="550" y="290" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">C</text>
  
  <!-- Legend -->
  <rect x="200" y="430" width="400" height="60" rx="5" ry="5" fill="white" stroke="#95a5a6"/>
  <line x1="220" y1="450" x2="250" y2="450" stroke="#3498db" stroke-width="3"/>
  <text x="260" y="455" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">General Performance</text>
  
  <line x1="400" y1="450" x2="430" y2="450" stroke="#e74c3c" stroke-width="3"/>
  <text x="440" y="455" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Linguistic Diversity</text>
  
  <line x1="220" y1="475" x2="250" y2="475" stroke="#2ecc71" stroke-width="3"/>
  <text x="260" y="480" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Technical Knowledge</text>
  
  <line x1="400" y1="475" x2="430" y2="475" stroke="#95a5a6" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="440" y="480" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Critical Thresholds</text>
</svg> 