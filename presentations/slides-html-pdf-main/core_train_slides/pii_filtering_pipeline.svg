<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa" rx="5" ry="5"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">PII Management Strategy</text>
  
  <!-- Pipeline Stages -->
  <!-- Stage boxes -->
  <rect x="100" y="100" width="160" height="80" rx="10" ry="10" fill="#3498db" opacity="0.8"/>
  <rect x="320" y="100" width="160" height="80" rx="10" ry="10" fill="#9b59b6" opacity="0.8"/>
  <rect x="540" y="100" width="160" height="80" rx="10" ry="10" fill="#2ecc71" opacity="0.8"/>
  
  <!-- Stage titles -->
  <text x="180" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Pattern Recognition</text>
  <text x="180" y="150" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Regex-based Detection</text>
  
  <text x="400" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">PII Transformation</text>
  <text x="400" y="150" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Filtering Sensitive Data</text>
  
  <text x="620" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Verification</text>
  <text x="620" y="150" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Quality Assurance</text>
  
  <!-- Connecting arrows -->
  <line x1="260" y1="140" x2="320" y2="140" stroke="#7f8c8d" stroke-width="2"/>
  <polygon points="320,140 310,135 310,145" fill="#7f8c8d"/>
  
  <line x1="480" y1="140" x2="540" y2="140" stroke="#7f8c8d" stroke-width="2"/>
  <polygon points="540,140 530,135 530,145" fill="#7f8c8d"/>
  
  <!-- Example Text Transformations -->
  <!-- Example 1: ID Number -->
  <rect x="50" y="220" width="700" height="60" rx="5" ry="5" fill="white" stroke="#95a5a6"/>
  <text x="70" y="245" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Input Text:</text>
  <text x="180" y="245" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">My Swedish personal number is 820517-3411, please contact me at</text>
  <text x="70" y="270" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Filtered:</text>
  <text x="180" y="270" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">My Swedish personal number is [REDACTED], please contact me at</text>
  
  <!-- Example 2: Bank Account -->
  <rect x="50" y="290" width="700" height="60" rx="5" ry="5" fill="white" stroke="#95a5a6"/>
  <text x="70" y="315" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Input Text:</text>
  <text x="180" y="315" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">Please transfer to IBAN: DE89 3704 0044 0532 0130 00 for immediate</text>
  <text x="70" y="340" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Filtered:</text>
  <text x="180" y="340" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">Please transfer to IBAN: [REDACTED] for immediate</text>
  
  <!-- Example 3: Contact Info -->
  <rect x="50" y="360" width="700" height="60" rx="5" ry="5" fill="white" stroke="#95a5a6"/>
  <text x="70" y="385" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Input Text:</text>
  <text x="180" y="385" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">You can reach our office at +45 12 34 56 78 or email info@company.dk</text>
  <text x="70" y="410" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Filtered:</text>
  <text x="180" y="410" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">You can reach our office at [REDACTED] or email [REDACTED]</text>
  
  <!-- Regex Pattern Examples -->
  <rect x="150" y="440" width="500" height="50" rx="5" ry="5" fill="#ecf0f1" stroke="#95a5a6"/>
  <text x="180" y="465" font-family="monospace" font-size="12" fill="#2c3e50">Swedish Personal Number: ^\d{6}[-\s]\d{4}$</text>
  <text x="180" y="485" font-family="monospace" font-size="12" fill="#2c3e50">IBAN: [A-Z]{2}\d{2}[\s](?:\d{4}[\s]){4}\d{2}|[A-Z]{2}\d{20}</text>
  
  <!-- Language-specific Note -->
  <rect x="50" y="440" width="90" height="50" rx="5" ry="5" fill="#e74c3c" opacity="0.8"/>
  <text x="95" y="465" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Language</text>
  <text x="95" y="485" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Specific</text>
  
  <!-- Implementation Principles -->
  <rect x="650" y="220" width="100" height="190" rx="5" ry="5" fill="#3498db" opacity="0.2"/>
  <text x="700" y="240" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">Principles</text>
  <text x="700" y="265" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">High</text>
  <text x="700" y="280" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Precision</text>
  <line x1="660" y1="290" x2="740" y2="290" stroke="#95a5a6" stroke-width="1"/>
  <text x="700" y="315" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Language</text>
  <text x="700" y="330" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Specific</text>
  <line x1="660" y1="340" x2="740" y2="340" stroke="#95a5a6" stroke-width="1"/>
  <text x="700" y="365" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Clear</text>
  <text x="700" y="380" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Identifiers</text>
</svg> 