<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa" rx="5" ry="5"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">Three-Layer Filtering Process</text>
  
  <!-- Funnel Layers -->
  <!-- Layer 1: High-Risk Exclusion -->
  <path d="M200,100 L600,100 L550,200 L250,200 Z" fill="#e74c3c" opacity="0.8"/>
  <text x="400" y="150" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Layer 1: High-Risk Exclusion</text>
  <text x="400" y="175" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Copyrighted Books, Paywalled Content</text>
  
  <!-- Layer 2: License Compatibility -->
  <path d="M250,210 L550,210 L500,310 L300,310 Z" fill="#f39c12" opacity="0.8"/>
  <text x="400" y="260" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Layer 2: License Compatibility</text>
  <text x="400" y="285" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">NonCommercial (NC), ShareAlike (SA)</text>
  
  <!-- Layer 3: TDM Exception -->
  <path d="M300,320 L500,320 L450,420 L350,420 Z" fill="#2ecc71" opacity="0.8"/>
  <text x="400" y="370" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Layer 3: TDM Exception</text>
  <text x="400" y="395" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Machine-Readable Opt-outs</text>
  
  <!-- Final Output -->
  <rect x="350" y="430" width="100" height="40" rx="5" ry="5" fill="#3498db" opacity="0.8"/>
  <text x="400" y="455" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Final Dataset</text>
  
  <!-- Data Volume Indicators -->
  <text x="650" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#2c3e50">Initial Web Data</text>
  <text x="650" y="170" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#2c3e50">100% Volume</text>
  
  <text x="650" y="260" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#2c3e50">After High-Risk Removal</text>
  <text x="650" y="280" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#2c3e50">~80% Volume</text>
  
  <text x="650" y="370" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#2c3e50">After License Filtering</text>
  <text x="650" y="390" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#2c3e50">~50% Volume</text>
  
  <text x="650" y="455" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#2c3e50">Compliant Dataset</text>
  <text x="650" y="475" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#2c3e50">~35% Volume</text>
  
  <!-- Connector Lines for Volume Indicators -->
  <line x1="620" y1="160" x2="600" y2="150" stroke="#95a5a6" stroke-width="1"/>
  <line x1="620" y1="270" x2="550" y2="250" stroke="#95a5a6" stroke-width="1"/>
  <line x1="620" y1="380" x2="500" y2="370" stroke="#95a5a6" stroke-width="1"/>
  <line x1="620" y1="465" x2="450" y2="450" stroke="#95a5a6" stroke-width="1"/>
  
  <!-- Left Side Annotations -->
  <text x="150" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#2c3e50">Filter Out:</text>
  <text x="150" y="170" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#2c3e50">• Copyrighted books</text>
  <text x="150" y="190" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#2c3e50">• Paywalled content</text>
  
  <text x="150" y="260" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#2c3e50">Filter Out:</text>
  <text x="150" y="280" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#2c3e50">• NC licenses</text>
  <text x="150" y="300" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#2c3e50">• SA licenses</text>
  
  <text x="150" y="370" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#2c3e50">Filter Out:</text>
  <text x="150" y="390" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#2c3e50">• robots.txt opt-outs</text>
  <text x="150" y="410" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#2c3e50">• ai.txt restrictions</text>
  
  <!-- Connector Lines for Annotations -->
  <line x1="170" y1="170" x2="220" y2="150" stroke="#95a5a6" stroke-width="1"/>
  <line x1="170" y1="280" x2="270" y2="260" stroke="#95a5a6" stroke-width="1"/>
  <line x1="170" y1="390" x2="320" y2="370" stroke="#95a5a6" stroke-width="1"/>
</svg> 