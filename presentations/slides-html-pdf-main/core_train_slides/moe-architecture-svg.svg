<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f7fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e4e9f2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="router-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6a11cb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2575fc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="expert-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0072ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00c6ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shared-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9a9e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fad0c4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="output-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="opt-gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="opt-gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5ee7df;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b490ca;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="opt-gradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbc2eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a6c1ee;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="5" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="url(#bg-gradient)" />
  
  <!-- Title -->
  <text x="500" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">Advanced MoE Architecture Optimization</text>
  
  <!-- Input Node -->
  <rect x="425" y="80" width="150" height="40" rx="10" ry="10" fill="#fff" stroke="#ccc" stroke-width="2" filter="url(#shadow)" />
  <text x="500" y="105" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#333">Input Token</text>
  
  <!-- Router Node -->
  <rect x="375" y="150" width="250" height="60" rx="10" ry="10" fill="url(#router-gradient)" stroke="#6a11cb" stroke-width="2" filter="url(#shadow)" />
  <text x="500" y="175" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#fff">Router Network (30B)</text>
  <text x="500" y="195" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff">Dynamic Expert Selection</text>
  
  <!-- Connection Input to Router -->
  <line x1="500" y1="120" x2="500" y2="150" stroke="#999" stroke-width="3" stroke-dasharray="5,3" />
  
  <!-- Expert Nodes -->
  <rect x="100" y="250" width="150" height="50" rx="10" ry="10" fill="url(#expert-gradient)" stroke="#0072ff" stroke-width="2" filter="url(#shadow)" />
  <text x="175" y="280" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#fff">BitNet Expert 1</text>
  
  <rect x="275" y="250" width="150" height="50" rx="10" ry="10" fill="url(#expert-gradient)" stroke="#0072ff" stroke-width="2" filter="url(#shadow)" />
  <text x="350" y="280" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#fff">BitNet Expert 2</text>
  
  <rect x="450" y="250" width="100" height="50" rx="10" ry="10" fill="url(#expert-gradient)" stroke="#0072ff" stroke-width="2" filter="url(#shadow)" />
  <text x="500" y="280" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#fff">...</text>
  
  <rect x="575" y="250" width="150" height="50" rx="10" ry="10" fill="url(#expert-gradient)" stroke="#0072ff" stroke-width="2" filter="url(#shadow)" />
  <text x="650" y="280" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#fff">BitNet Expert N</text>
  
  <rect x="750" y="250" width="150" height="50" rx="10" ry="10" fill="url(#shared-gradient)" stroke="#ff9a9e" stroke-width="2" filter="url(#shadow)" />
  <text x="825" y="280" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#333">Shared Expert</text>
  
  <!-- Connections Router to Experts -->
  <line x1="500" y1="210" x2="175" y2="250" stroke="#999" stroke-width="3" />
  <line x1="500" y1="210" x2="350" y2="250" stroke="#999" stroke-width="3" />
  <line x1="500" y1="210" x2="500" y2="250" stroke="#999" stroke-width="3" />
  <line x1="500" y1="210" x2="650" y2="250" stroke="#999" stroke-width="3" />
  <line x1="500" y1="210" x2="825" y2="250" stroke="#999" stroke-width="3" />
  
  <!-- Output Node -->
  <rect x="375" y="350" width="250" height="50" rx="10" ry="10" fill="url(#output-gradient)" stroke="#4facfe" stroke-width="2" filter="url(#shadow)" />
  <text x="500" y="380" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">Output Hidden Layer</text>
  
  <!-- Connections Experts to Output -->
  <line x1="175" y1="300" x2="500" y2="350" stroke="#999" stroke-width="3" />
  <line x1="350" y1="300" x2="500" y2="350" stroke="#999" stroke-width="3" />
  <line x1="500" y1="300" x2="500" y2="350" stroke="#999" stroke-width="3" />
  <line x1="650" y1="300" x2="500" y2="350" stroke="#999" stroke-width="3" />
  <line x1="825" y1="300" x2="500" y2="350" stroke="#999" stroke-width="3" />
  
  <!-- Optimization Boxes -->
  <rect x="50" y="430" width="280" height="120" rx="10" ry="10" fill="url(#opt-gradient1)" stroke="#f093fb" stroke-width="2" filter="url(#shadow)" />
  <text x="190" y="455" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">BitNet Implementation</text>
  <text x="190" y="480" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff">• 8-bit quantized weights</text>
  <text x="190" y="505" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff">• Block-wise quantization</text>
  <text x="190" y="530" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff">• 50-75% memory reduction</text>
  
  <rect x="360" y="430" width="280" height="120" rx="10" ry="10" fill="url(#opt-gradient2)" stroke="#5ee7df" stroke-width="2" filter="url(#shadow)" />
  <text x="500" y="455" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">Advanced Load Balancing</text>
  <text x="500" y="480" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff">• Auxiliary-loss-free routing</text>
  <text x="500" y="505" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff">• Dynamic bias adjustment</text>
  <text x="500" y="530" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff">• Enhanced expert specialization</text>
  
  <rect x="670" y="430" width="280" height="120" rx="10" ry="10" fill="url(#opt-gradient3)" stroke="#fbc2eb" stroke-width="2" filter="url(#shadow)" />
  <text x="810" y="455" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">Training Infrastructure</text>
  <text x="810" y="480" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff">• DualPipe algorithm</text>
  <text x="810" y="505" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff">• Computation-communication overlap</text>
  <text x="810" y="530" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff">• Memory-saving techniques</text>
  
  <!-- Connection lines from model to optimizations -->
  <path d="M375 350 Q250 400 190 430" stroke="#999" stroke-width="2" stroke-dasharray="5,3" fill="none" />
  <path d="M500 400 Q500 415 500 430" stroke="#999" stroke-width="2" stroke-dasharray="5,3" fill="none" />
  <path d="M625 350 Q750 400 810 430" stroke="#999" stroke-width="2" stroke-dasharray="5,3" fill="none" />
  
  <!-- Performance comparison callout -->
  <rect x="800" y="120" width="180" height="100" rx="10" ry="10" fill="#fff" stroke="#4facfe" stroke-width="2" filter="url(#shadow)" />
  <text x="890" y="140" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">vs. DeepSeek V3</text>
  <text x="890" y="160" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">• 15-20% compute reduction</text>
  <text x="890" y="180" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">• Comparable benchmarks</text>
  <text x="890" y="200" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">• EU compliance integration</text>
  
  <!-- Watermark -->
  <text x="980" y="590" font-family="Arial, sans-serif" font-size="10" text-anchor="end" fill="#999" opacity="0.7">EU LLM Training Project</text>
</svg>
