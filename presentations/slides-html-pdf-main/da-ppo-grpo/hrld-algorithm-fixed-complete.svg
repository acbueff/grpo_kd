<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa" rx="10" ry="10"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">Hybrid Reinforcement Learning and Distillation (HRLD) Framework</text>
  
  <!-- Start Block -->
  <rect x="350" y="70" width="100" height="40" fill="#f5f5f5" stroke="#616161" stroke-width="2" rx="8" ry="8"/>
  <text x="400" y="95" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Start</text>
  
  <!-- Initialize Student -->
  <rect x="300" y="130" width="200" height="40" fill="#d1c4e9" stroke="#4527a0" stroke-width="2" rx="5" ry="5"/>
  <text x="400" y="155" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Initialize Student Model</text>
  
  <!-- Start to Init arrow -->
  <line x1="400" y1="110" x2="400" y2="130" stroke="#616161" stroke-width="1.5"/>
  <polygon points="400,130 395,120 405,120" fill="#616161"/>
  
  <!-- Training Loop -->
  <rect x="300" y="190" width="200" height="40" fill="#f5f5f5" stroke="#616161" stroke-width="2" rx="5" ry="5"/>
  <text x="400" y="215" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Begin Training Loop</text>
  
  <!-- Init to Loop arrow -->
  <line x1="400" y1="170" x2="400" y2="190" stroke="#616161" stroke-width="1.5"/>
  <polygon points="400,190 395,180 405,180" fill="#616161"/>
  
  <!-- Phase Decision -->
  <polygon points="400,250 450,290 400,330 350,290" fill="#f5f5f5" stroke="#616161" stroke-width="2"/>
  <text x="400" y="295" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Choose Phase</text>
  
  <!-- Loop to Decision arrow -->
  <line x1="400" y1="230" x2="400" y2="250" stroke="#616161" stroke-width="1.5"/>
  <polygon points="400,250 395,240 405,240" fill="#616161"/>
  
  <!-- Distillation Phase -->
  <rect x="150" y="350" width="200" height="40" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="5" ry="5"/>
  <text x="250" y="375" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Knowledge Distillation Phase</text>
  
  <!-- Decision to Distillation arrow -->
  <line x1="350" y1="290" x2="250" y2="350" stroke="#1976d2" stroke-width="1.5"/>
  <polygon points="250,350 252,340 260,345" fill="#1976d2"/>
  <text x="270" y="325" font-family="Arial" font-size="12" text-anchor="middle" fill="#1976d2">With probability p</text>
  
  <!-- RL Phase -->
  <rect x="450" y="350" width="200" height="40" fill="#ffebee" stroke="#c62828" stroke-width="2" rx="5" ry="5"/>
  <text x="550" y="375" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Reinforcement Learning Phase</text>
  
  <!-- Decision to RL arrow -->
  <line x1="450" y1="290" x2="550" y2="350" stroke="#c62828" stroke-width="1.5"/>
  <polygon points="550,350 540,345 548,340" fill="#c62828"/>
  <text x="530" y="325" font-family="Arial" font-size="12" text-anchor="middle" fill="#c62828">With probability 1-p</text>
  
  <!-- Teacher Model -->
  <rect x="50" y="410" width="140" height="40" fill="#fceaff" stroke="#8e44ad" stroke-width="2" rx="5" ry="5"/>
  <text x="120" y="435" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Teacher Model</text>
  
  <!-- Teacher Generation -->
  <rect x="50" y="470" width="140" height="40" fill="#fceaff" stroke="#8e44ad" stroke-width="2" rx="5" ry="5"/>
  <text x="120" y="495" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Generate Demonstrations</text>
  
  <!-- Teacher to Gen arrow -->
  <line x1="120" y1="450" x2="120" y2="470" stroke="#8e44ad" stroke-width="1.5"/>
  <polygon points="120,470 115,460 125,460" fill="#8e44ad"/>
  
  <!-- Supervised Update -->
  <rect x="230" y="470" width="140" height="40" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="5" ry="5"/>
  <text x="300" y="495" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Supervised Learning</text>
  
  <!-- Distillation to Teacher arrow -->
  <line x1="250" y1="390" x2="120" y2="410" stroke="#666" stroke-width="1.5"/>
  <polygon points="120,410 125,400 130,405" fill="#666"/>
  
  <!-- Teacher Gen to Supervised arrow -->
  <line x1="190" y1="490" x2="230" y2="490" stroke="#666" stroke-width="1.5"/>
  <polygon points="230,490 220,485 220,495" fill="#666"/>
  
  <!-- Student Sampling -->
  <rect x="450" y="410" width="140" height="40" fill="#ffebee" stroke="#c62828" stroke-width="2" rx="5" ry="5"/>
  <text x="520" y="435" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Sample Prompts and</text>
  <text x="520" y="450" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Generate Outputs</text>
  
  <!-- RL to Student Sampling arrow -->
  <line x1="550" y1="390" x2="520" y2="410" stroke="#c62828" stroke-width="1.5"/>
  <polygon points="520,410 525,400 530,405" fill="#c62828"/>
  
  <!-- Compute Rewards -->
  <rect x="450" y="470" width="140" height="40" fill="#ffebee" stroke="#c62828" stroke-width="2" rx="5" ry="5"/>
  <text x="520" y="495" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Compute Rewards</text>
  
  <!-- Student Sampling to Rewards arrow -->
  <line x1="520" y1="450" x2="520" y2="470" stroke="#c62828" stroke-width="1.5"/>
  <polygon points="520,470 515,460 525,460" fill="#c62828"/>
  
  <!-- RL Update -->
  <rect x="610" y="470" width="140" height="40" fill="#ffebee" stroke="#c62828" stroke-width="2" rx="5" ry="5"/>
  <text x="680" y="495" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">PPO/GRPO Update</text>
  
  <!-- Rewards to RL Update arrow -->
  <line x1="590" y1="490" x2="610" y2="490" stroke="#666" stroke-width="1.5"/>
  <polygon points="610,490 600,485 600,495" fill="#666"/>
  
  <!-- Update Student Paths -->
  <!-- From Supervised -->
  <line x1="300" y1="510" x2="300" y2="530" stroke="#1976d2" stroke-width="1.5"/>
  <line x1="300" y1="530" x2="400" y2="530" stroke="#1976d2" stroke-width="1.5"/>
  <polygon points="300,510 295,520 305,520" fill="#1976d2"/>
  
  <!-- From RL Update -->
  <line x1="680" y1="510" x2="680" y2="530" stroke="#c62828" stroke-width="1.5"/>
  <line x1="680" y1="530" x2="400" y2="530" stroke="#c62828" stroke-width="1.5"/>
  <polygon points="680,510 675,520 685,520" fill="#c62828"/>
  
  <!-- Adjust Phase Probabilities -->
  <rect x="300" y="550" width="200" height="40" fill="#f5f5f5" stroke="#616161" stroke-width="2" rx="5" ry="5"/>
  <text x="400" y="570" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Adjust Phase Probabilities</text>
  <text x="400" y="585" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">p = p * anneal_factor</text>
  
  <!-- Update to Adjust arrow -->
  <line x1="400" y1="530" x2="400" y2="550" stroke="#616161" stroke-width="1.5"/>
  <polygon points="400,550 395,540 405,540" fill="#616161"/>
  
  <!-- Loop Back -->
  <path d="M 250,570 Q 200,570 200,450 Q 200,400 250,400" fill="none" stroke="#616161" stroke-width="1.5" stroke-dasharray="5,5"/>
  <polygon points="250,400 240,395 240,405" fill="#616161"/>
  
  <path d="M 550,570 Q 600,570 600,450 Q 600,400 550,400" fill="none" stroke="#616161" stroke-width="1.5" stroke-dasharray="5,5"/>
  <polygon points="550,400 540,395 540,405" fill="#616161"/>
  
  <!-- Final Student Model -->
  <rect x="700" y="340" width="80" height="80" fill="#d1c4e9" stroke="#4527a0" stroke-width="2" rx="8" ry="8"/>
  <text x="740" y="370" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Final</text>
  <text x="740" y="390" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Student</text>
  
  <!-- Check if Done -->
  <polygon points="550,290 600,290 600,330 550,330" fill="#f5f5f5" stroke="#616161" stroke-width="2"/>
  <text x="575" y="315" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Done?</text>
  
  <!-- Loop to Check arrow -->
  <line x1="500" y1="530" x2="575" y2="530" stroke="#616161" stroke-width="1.5"/>
  <line x1="575" y1="530" x2="575" y2="330" stroke="#616161" stroke-width="1.5"/>
  <polygon points="575,330 570,340 580,340" fill="#616161"/>
  
  <!-- Check to Final arrow -->
  <line x1="600" y1="310" x2="700" y2="310" stroke="#616161" stroke-width="1.5"/>
  <line x1="700" y1="310" x2="700" y2="340" stroke="#616161" stroke-width="1.5"/>
  <polygon points="700,340 695,330 705,330" fill="#616161"/>
  <text x="640" y="300" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Yes</text>
  
  <!-- Check back to Loop arrow -->
  <line x1="575" y1="290" x2="575" y2="210" stroke="#616161" stroke-width="1.5"/>
  <line x1="575" y1="210" x2="500" y2="210" stroke="#616161" stroke-width="1.5"/>
  <polygon points="500,210 510,205 510,215" fill="#616161"/>
  <text x="530" y="230" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">No</text>
</svg>