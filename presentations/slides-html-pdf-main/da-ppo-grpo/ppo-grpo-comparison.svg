<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa" rx="10" ry="10"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">PPO vs GRPO Architecture Comparison</text>
  
  <!-- PPO Box -->
  <rect x="50" y="80" width="320" height="370" fill="#e6f2ff" stroke="#3771c8" stroke-width="2" rx="10" ry="10"/>
  <text x="210" y="110" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">PPO</text>
  
  <!-- GRPO Box -->
  <rect x="430" y="80" width="320" height="370" fill="#e5f6e5" stroke="#379237" stroke-width="2" rx="10" ry="10"/>
  <text x="590" y="110" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">GRPO</text>
  
  <!-- PPO Components -->
  <!-- Actor -->
  <rect x="100" y="140" width="220" height="60" fill="#b3d1ff" stroke="#1C3E76" stroke-width="2" rx="5" ry="5"/>
  <text x="210" y="175" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Policy Network (Actor)</text>
  
  <!-- Critic -->
  <rect x="100" y="250" width="220" height="60" fill="#b3d1ff" stroke="#1C3E76" stroke-width="2" rx="5" ry="5"/>
  <text x="210" y="285" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Value Network (Critic)</text>
  
  <!-- PPO Computation Box -->
  <rect x="70" y="340" width="280" height="80" fill="#fff" stroke="#3771c8" stroke-width="1" rx="5" ry="5"/>
  <text x="210" y="365" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">• Advantage estimation via value network</text>
  <text x="210" y="390" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">• Policy clipping to constrain updates</text>
  <text x="210" y="415" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">• High memory usage (two networks)</text>
  
  <!-- GRPO Components -->
  <!-- Policy Group -->
  <rect x="480" y="140" width="100" height="60" fill="#b8e6b8" stroke="#1F571F" stroke-width="2" rx="5" ry="5"/>
  <text x="530" y="175" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Policy</text>
  
  <!-- Multiple Outputs -->
  <rect x="450" y="230" width="40" height="40" fill="#b8e6b8" stroke="#1F571F" stroke-width="1" rx="5" ry="5"/>
  <rect x="510" y="230" width="40" height="40" fill="#b8e6b8" stroke="#1F571F" stroke-width="1" rx="5" ry="5"/>
  <rect x="570" y="230" width="40" height="40" fill="#b8e6b8" stroke="#1F571F" stroke-width="1" rx="5" ry="5"/>
  <text x="530" y="255" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Multiple outputs per prompt</text>
  
  <!-- Group stats -->
  <rect x="480" y="290" width="100" height="40" fill="#fff" stroke="#379237" stroke-width="1" rx="5" ry="5"/>
  <text x="530" y="315" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Group statistics</text>
  
  <!-- GRPO Computation Box -->
  <rect x="450" y="340" width="280" height="80" fill="#fff" stroke="#379237" stroke-width="1" rx="5" ry="5"/>
  <text x="590" y="365" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">• Group-based advantage estimation</text>
  <text x="590" y="390" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">• No separate value network needed</text>
  <text x="590" y="415" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">• Memory efficient but more sampling</text>
  
  <!-- Arrows in PPO -->
  <line x1="210" y1="200" x2="210" y2="250" stroke="#1C3E76" stroke-width="2"/>
  <polygon points="210,250 205,240 215,240" fill="#1C3E76"/>
  
  <line x1="210" y1="310" x2="210" y2="340" stroke="#1C3E76" stroke-width="2"/>
  <polygon points="210,340 205,330 215,330" fill="#1C3E76"/>
  
  <!-- Arrows in GRPO -->
  <line x1="530" y1="200" x2="530" y2="230" stroke="#1F571F" stroke-width="2"/>
  <polygon points="530,230 525,220 535,220" fill="#1F571F"/>
  
  <line x1="450" y1="270" x2="450" y2="290" stroke="#1F571F" stroke-width="1"/>
  <polygon points="450,290 445,280 455,280" fill="#1F571F"/>
  
  <line x1="510" y1="270" x2="510" y2="290" stroke="#1F571F" stroke-width="1"/>
  <polygon points="510,290 505,280 515,280" fill="#1F571F"/>
  
  <line x1="570" y1="270" x2="570" y2="290" stroke="#1F571F" stroke-width="1"/>
  <polygon points="570,290 565,280 575,280" fill="#1F571F"/>
  
  <line x1="530" y1="330" x2="530" y2="340" stroke="#1F571F" stroke-width="2"/>
  <polygon points="530,340 525,330 535,330" fill="#1F571F"/>
</svg>