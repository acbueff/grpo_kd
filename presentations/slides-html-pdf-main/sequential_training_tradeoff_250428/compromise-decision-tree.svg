<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650">
  <!-- Background -->
  <rect width="900" height="650" fill="#f8f9fa" rx="10" ry="10"/>
  <text x="450" y="40" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="bold">Compromise Solution Decision Tree</text>
  
  <!-- Starting node -->
  <rect x="350" y="80" width="200" height="60" rx="30" ry="30" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="450" y="115" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">Prioritize Scientific Validity 
  or Engineering Output?</text>
  
  <!-- First level branches -->
  <line x1="400" y1="140" x2="300" y2="180" stroke="#333" stroke-width="2"/>
  <text x="340" y="165" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-style="italic">Scientific Validity</text>
  
  <line x1="500" y1="140" x2="600" y2="180" stroke="#333" stroke-width="2"/>
  <text x="570" y="165" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-style="italic">Engineering Output</text>
  
  <!-- Scientific branch nodes -->
  <rect x="200" y="180" width="200" height="50" rx="25" ry="25" fill="#fff8e1" stroke="#ff8f00" stroke-width="2"/>
  <text x="300" y="210" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">How much compute available?</text>
  
  <!-- Engineering branch nodes -->
  <rect x="500" y="180" width="200" height="50" rx="25" ry="25" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="600" y="210" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Final model quality critical?</text>
  
  <!-- Scientific sub-branches -->
  <line x1="250" y1="230" x2="200" y2="270" stroke="#333" stroke-width="2"/>
  <text x="205" y="255" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-style="italic">Limited</text>
  
  <line x1="350" y1="230" x2="400" y2="270" stroke="#333" stroke-width="2"/>
  <text x="395" y="255" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-style="italic">Abundant</text>
  
  <!-- Engineering sub-branches -->
  <line x1="550" y1="230" x2="550" y2="270" stroke="#333" stroke-width="2"/>
  <text x="560" y="255" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-style="italic">No</text>
  
  <line x1="650" y1="230" x2="740" y2="270" stroke="#333" stroke-width="2"/>
  <text x="720" y="255" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-style="italic">Yes</text>
  
  <!-- Limited compute options -->
  <rect x="100" y="270" width="200" height="50" rx="5" ry="5" fill="#fff8e1" stroke="#ff8f00" stroke-width="2"/>
  <text x="200" y="300" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Use smaller model size</text>
  
  <line x1="200" y1="320" x2="200" y2="360" stroke="#333" stroke-width="2"/>
  
  <rect x="100" y="360" width="200" height="80" rx="5" ry="5" fill="#ffebee" stroke="#c62828" stroke-width="1"/>
  <text x="200" y="380" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">Approach A: 3x 3B Models</text>
  <text x="200" y="400" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Train separate smaller models</text>
  <text x="200" y="420" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">on each compliance level</text>
  
  <!-- Abundant compute options -->
  <rect x="300" y="270" width="200" height="50" rx="5" ry="5" fill="#fff8e1" stroke="#ff8f00" stroke-width="2"/>
  <text x="400" y="300" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Full-scale experiments</text>
  
  <line x1="400" y1="320" x2="400" y2="360" stroke="#333" stroke-width="2"/>
  
  <rect x="300" y="360" width="200" height="80" rx="5" ry="5" fill="#ffebee" stroke="#c62828" stroke-width="1"/>
  <text x="400" y="380" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">Approach B: Branched 100B</text>
  <text x="400" y="400" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Train a base model, then fork into</text>
  <text x="400" y="420" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">three compliance branches</text>
  
  <!-- Engineering - Not critical options -->
  <rect x="500" y="270" width="200" height="50" rx="5" ry="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="600" y="300" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Balanced approach</text>
  
  <line x1="600" y1="320" x2="600" y2="360" stroke="#333" stroke-width="2"/>
  
  <rect x="500" y="360" width="200" height="80" rx="5" ry="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="600" y="380" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">Approach C: Uniform Mixture</text>
  <text x="600" y="400" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Train 100B on uniform mixture</text>
  <text x="600" y="420" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">of all compliance levels</text>
  
  <!-- Engineering - Critical options -->
  <rect x="700" y="270" width="200" height="50" rx="5" ry="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="800" y="300" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Maximize final quality</text>
  
  <line x1="800" y1="320" x2="800" y2="360" stroke="#333" stroke-width="2"/>
  
  <rect x="700" y="360" width="200" height="80" rx="5" ry="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="800" y="380" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">Sequential 100B</text>
  <text x="800" y="400" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Use all 2.5T tokens on one model</text>
  <text x="800" y="420" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">with sequential compliance levels</text>
  
  <!-- Compromise zone -->
  <rect x="200" y="480" width="500" height="150" rx="10" ry="10" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="450" y="500" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold">Recommended Compromise Solutions</text>
  
  <line x1="250" y1="440" x2="350" y2="520" stroke="#333" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="400" y1="440" x2="400" y2="520" stroke="#333" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="500" y1="440" x2="450" y2="520" stroke="#333" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="700" y1="440" x2="550" y2="520" stroke="#333" stroke-width="1" stroke-dasharray="5,5"/>
  
  <rect x="220" y="520" width="460" height="100" rx="5" ry="5" fill="white" stroke="#6a1b9a" stroke-width="1"/>
  <text x="240" y="540" font-family="Arial, sans-serif" font-size="14" text-anchor="start" font-weight="bold">1. Pilot Study + Modified Sequential Approach:</text>
  <text x="250" y="560" font-family="Arial, sans-serif" font-size="12" text-anchor="start">• Run small-scale pilot (e.g., 3B model) to validate experimental design</text>
  <text x="250" y="580" font-family="Arial, sans-serif" font-size="12" text-anchor="start">• Implement Sequential Training with overlapping stages (gradual mixing)</text>
  <text x="250" y="600" font-family="Arial, sans-serif" font-size="12" text-anchor="start">• Use advanced optimizers (SCION) for efficient training</text>
  <text x="450" y="615" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-style="italic" fill="#6a1b9a">Balances scientific validity with engineering goals</text>
</svg>