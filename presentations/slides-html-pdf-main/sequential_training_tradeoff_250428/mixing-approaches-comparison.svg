<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <!-- Background -->
  <rect width="900" height="600" fill="#f8f9fa" rx="10" ry="10"/>
  <text x="450" y="40" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="bold">Data Mixing Approaches Comparison</text>
  
  <!-- Section headers -->
  <text x="225" y="80" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" font-weight="bold">Sequential Approach</text>
  <text x="675" y="80" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" font-weight="bold">Compromise: Graduated Mixing</text>
  
  <!-- Dividing line -->
  <line x1="450" y1="90" x2="450" y2="520" stroke="#888" stroke-width="2" stroke-dasharray="10,5"/>
  
  <!-- Sequential Approach Visualization -->
  <rect x="75" y="110" width="300" height="350" rx="5" ry="5" fill="#fff" stroke="#333" stroke-width="1"/>
  
  <!-- Token stages -->
  <rect x="125" y="150" width="200" height="70" fill="#7ac142" stroke="#333" stroke-width="1"/>
  <rect x="125" y="220" width="200" height="70" fill="#ffc845" stroke="#333" stroke-width="1"/>
  <rect x="125" y="290" width="200" height="70" fill="#ff6b45" stroke="#333" stroke-width="1"/>
  
  <!-- Token labels -->
  <text x="225" y="140" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">0.83T Tokens</text>
  <text x="225" y="185" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">100% High Compliance</text>
  
  <text x="225" y="210" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">0.84T Tokens</text>
  <text x="225" y="255" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">100% Medium Compliance</text>
  
  <text x="225" y="280" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">0.83T Tokens</text>
  <text x="225" y="325" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">100% Low Compliance</text>
  
  <!-- Model checkpoints -->
  <circle cx="335" y="185" r="10" fill="#3a7bd5" stroke="#333"/>
  <text x="335" y="165" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Model-HC</text>
  
  <circle cx="335" y="255" r="10" fill="#3a7bd5" stroke="#333"/>
  <text x="335" y="235" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Model-MC</text>
  
  <circle cx="335" y="325" r="10" fill="#3a7bd5" stroke="#333"/>
  <text x="335" y="305" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Model-LC</text>
  
  <!-- Characteristics -->
  <rect x="100" y="370" width="250" height="80" rx="5" ry="5" fill="#f1f8e9" stroke="#558b2f" stroke-width="1"/>
  <text x="225" y="390" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">Characteristics:</text>
  <text x="225" y="410" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• Sharp boundaries between data types</text>
  <text x="225" y="430" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• Potential "shock" to model at transitions</text>
  <text x="225" y="450" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• Confounding with training duration</text>
  
  <!-- Graduated Mixing Approach Visualization -->
  <rect x="525" y="110" width="300" height="350" rx="5" ry="5" fill="#fff" stroke="#333" stroke-width="1"/>
  
  <!-- Gradient rectangle for mixing -->
  <defs>
    <linearGradient id="gradientMix1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7ac142;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffc845;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradientMix2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffc845;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b45;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Token stages with gradients -->
  <rect x="575" y="150" width="200" height="70" fill="#7ac142" stroke="#333" stroke-width="1"/>
  <rect x="575" y="220" width="200" height="70" fill="url(#gradientMix1)" stroke="#333" stroke-width="1"/>
  <rect x="575" y="290" width="200" height="70" fill="url(#gradientMix2)" stroke="#333" stroke-width="1"/>
  
  <!-- Token labels -->
  <text x="675" y="140" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">0.5T Tokens</text>
  <text x="675" y="185" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">100% High Compliance</text>
  
  <text x="675" y="210" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">1.0T Tokens</text>
  <text x="675" y="255" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">Gradual HC → MC Transition</text>
  
  <text x="675" y="280" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">1.0T Tokens</text>
  <text x="675" y="325" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">Gradual MC → LC Transition</text>
  
  <!-- Model checkpoints -->
  <circle cx="785" y="185" r="10" fill="#3a7bd5" stroke="#333"/>
  <text x="785" y="165" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Checkpoint 1</text>
  
  <circle cx="785" y="255" r="10" fill="#3a7bd5" stroke="#333"/>
  <text x="785" y="235" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Checkpoint 2</text>
  
  <circle cx="785" y="325" r="10" fill="#3a7bd5" stroke="#333"/>
  <text x="785" y="305" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Checkpoint 3</text>
  
  <!-- Characteristics -->
  <rect x="550" y="370" width="250" height="80" rx="5" ry="5" fill="#f1f8e9" stroke="#558b2f" stroke-width="1"/>
  <text x="675" y="390" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">Characteristics:</text>
  <text x="675" y="410" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• Smoother transitions between data types</text>
  <text x="675" y="430" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• Reduces catastrophic forgetting</text>
  <text x="675" y="450" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• More natural curriculum learning</text>
  
  <!-- Alternative: Uniform Mix (bottom) -->
  <rect x="75" y="480" width="750" height="100" rx="5" ry="5" fill="#e8eaf6" stroke="#3f51b5" stroke-width="1"/>
  <text x="450" y="500" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold">Alternative: Uniform Mixture (Baseline)</text>
  
  <!-- Uniform mix visualization -->
  <rect x="150" y="520" width="600" height="40" stroke="#333" stroke-width="1"/>
  
  <!-- Color segments to represent mixed data -->
  <rect x="150" y="520" width="200" height="40" fill="#7ac142" opacity="0.6"/>
  <rect x="350" y="520" width="200" height="40" fill="#ffc845" opacity="0.6"/>
  <rect x="550" y="520" width="200" height="40" fill="#ff6b45" opacity="0.6"/>
  
  <!-- Areas of overlap to show mixing -->
  <rect x="150" y="520" width="600" height="40" fill="url(#stripedPattern)" opacity="0.3"/>
  
  <defs>
    <pattern id="stripedPattern" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="5" height="10" fill="#7ac142" opacity="0.3"/>
      <rect x="5" width="5" height="10" fill="#ffc845" opacity="0.3"/>
    </pattern>
  </defs>
  
  <text x="450" y="545" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">All 2.5T tokens: Uniform mix of HC (33%), MC (33%), LC (33%)</text>
  
  <!-- Explanation (legend) -->
  <rect x="75" y="590" width="750" height="25" fill="none"/>
  <rect x="100" y="590" width="15" height="15" fill="#7ac142"/>
  <text x="120" y="602" font-family="Arial, sans-serif" font-size="12" text-anchor="start">HC Data</text>
  
  <rect x="200" y="590" width="15" height="15" fill="#ffc845"/>
  <text x="220" y="602" font-family="Arial, sans-serif" font-size="12" text-anchor="start">MC Data</text>
  
  <rect x="300" y="590" width="15" height="15" fill="#ff6b45"/>
  <text x="320" y="602" font-family="Arial, sans-serif" font-size="12" text-anchor="start">LC Data</text>
  
  <rect x="400" y="590" width="15" height="15" fill="url(#gradientMix1)"/>
  <text x="420" y="602" font-family="Arial, sans-serif" font-size="12" text-anchor="start">Gradual Transition</text>
  
  <circle cx="500" y="597" r="7" fill="#3a7bd5" stroke="#333"/>
  <text x="520" y="602" font-family="Arial, sans-serif" font-size="12" text-anchor="start">Model Checkpoint</text>
</svg>