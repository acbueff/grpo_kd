<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <!-- Background -->
  <rect width="900" height="600" fill="#f8f9fa" rx="10" ry="10"/>
  <text x="450" y="40" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="bold">Experimental Design Comparison</text>
  
  <!-- Column Headers -->
  <text x="150" y="80" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold">Sequential 100B</text>
  <text x="450" y="80" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold">Alt A: Independent 3B Models</text>
  <text x="750" y="80" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold">Alt B: Branched 100B</text>
  
  <!-- Diagrams for each approach -->
  <!-- Sequential Approach -->
  <rect x="50" y="110" width="200" height="180" rx="10" ry="10" fill="#f0f0f0" stroke="#666" stroke-width="1"/>
  
  <rect x="75" y="130" width="150" height="40" rx="5" ry="5" fill="#7ac142" stroke="#333" stroke-width="1"/>
  <text x="150" y="155" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">100B on HC Data</text>
  
  <line x1="150" y1="170" x2="150" y2="190" stroke="#333" stroke-width="2"/>
  <polygon points="145,185 150,195 155,185" fill="#333"/>
  
  <rect x="75" y="195" width="150" height="40" rx="5" ry="5" fill="#ffc845" stroke="#333" stroke-width="1"/>
  <text x="150" y="220" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">100B on MC Data</text>
  
  <line x1="150" y1="235" x2="150" y2="255" stroke="#333" stroke-width="2"/>
  <polygon points="145,250 150,260 155,250" fill="#333"/>
  
  <rect x="75" y="260" width="150" height="40" rx="5" ry="5" fill="#ff6b45" stroke="#333" stroke-width="1"/>
  <text x="150" y="285" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">100B on LC Data</text>
  
  <!-- Independent Models Approach -->
  <rect x="350" y="110" width="200" height="180" rx="10" ry="10" fill="#f0f0f0" stroke="#666" stroke-width="1"/>
  
  <rect x="375" y="130" width="150" height="40" rx="5" ry="5" fill="#7ac142" stroke="#333" stroke-width="1"/>
  <text x="450" y="155" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">3B on HC Data</text>
  
  <rect x="375" y="195" width="150" height="40" rx="5" ry="5" fill="#ffc845" stroke="#333" stroke-width="1"/>
  <text x="450" y="220" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">3B on MC Data</text>
  
  <rect x="375" y="260" width="150" height="40" rx="5" ry="5" fill="#ff6b45" stroke="#333" stroke-width="1"/>
  <text x="450" y="285" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">3B on LC Data</text>
  
  <!-- Branched Approach -->
  <rect x="650" y="110" width="200" height="180" rx="10" ry="10" fill="#f0f0f0" stroke="#666" stroke-width="1"/>
  
  <rect x="675" y="130" width="150" height="40" rx="5" ry="5" fill="#7ac142" stroke="#333" stroke-width="1"/>
  <text x="750" y="155" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">100B Base (HC)</text>
  
  <line x1="700" y1="170" x2="675" y2="190" stroke="#333" stroke-width="2"/>
  <polygon points="680,186 670,195 680,195" fill="#333"/>
  
  <line x1="750" y1="170" x2="750" y2="190" stroke="#333" stroke-width="2"/>
  <polygon points="745,185 750,195 755,185" fill="#333"/>
  
  <line x1="800" y1="170" x2="825" y2="190" stroke="#333" stroke-width="2"/>
  <polygon points="818,186 830,195 820,195" fill="#333"/>
  
  <rect x="625" y="195" width="75" height="40" rx="5" ry="5" fill="#7ac142" stroke="#333" stroke-width="1"/>
  <text x="662" y="220" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">HC Branch</text>
  
  <rect x="713" y="195" width="75" height="40" rx="5" ry="5" fill="#ffc845" stroke="#333" stroke-width="1"/>
  <text x="750" y="220" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">MC Branch</text>
  
  <rect x="800" y="195" width="75" height="40" rx="5" ry="5" fill="#ff6b45" stroke="#333" stroke-width="1"/>
  <text x="837" y="220" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">LC Branch</text>
  
  <!-- Comparison Metrics Table -->
  <line x1="50" y1="310" x2="850" y2="310" stroke="#333" stroke-width="2"/>
  
  <!-- Row Headers -->
  <text x="10" y="340" font-family="Arial, sans-serif" font-size="9" text-anchor="start" font-weight="bold">Token Budget</text>
  <text x="10" y="380" font-family="Arial, sans-serif" font-size="9" text-anchor="start" font-weight="bold">Scientific Rigor</text>
  <text x="10" y="420" font-family="Arial, sans-serif" font-size="9" text-anchor="start" font-weight="bold">Implementation</text>
  <text x="10" y="460" font-family="Arial, sans-serif" font-size="9" text-anchor="start" font-weight="bold">Scaling Considerations</text>
  <text x="10" y="500" font-family="Arial, sans-serif" font-size="9" text-anchor="start" font-weight="bold">Primary Advantage</text>
  <text x="10" y="540" font-family="Arial, sans-serif" font-size="9" text-anchor="start" font-weight="bold">Primary Disadvantage</text>
  
  <!-- Column 1 Values -->
  <text x="160" y="340" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">2.5T tokens (within budget)</text>
  
  <rect x="100" y="365" width="100" height="20" rx="3" ry="3" fill="#ffcccc"/>
  <text x="150" y="380" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Low (confounded)</text>
  
  <rect x="100" y="405" width="100" height="20" rx="3" ry="3" fill="#ccffcc"/>
  <text x="150" y="420" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Simple (one run)</text>
  
  <text x="175" y="460" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">True 100B behavior</text>
  
  <text x="170" y="500" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#006600">Maximizes final model quality</text>
  
  <text x="175" y="540" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#990000">Cannot isolate data effects</text>
  
  <!-- Column 2 Values -->
  <text x="450" y="340" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">~1.5T tokens (3×0.5T)</text>
  
  <rect x="400" y="365" width="100" height="20" rx="3" ry="3" fill="#ccffcc"/>
  <text x="450" y="380" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">High (direct comparison)</text>
  
  <rect x="400" y="405" width="100" height="20" rx="3" ry="3" fill="#ffffcc"/>
  <text x="450" y="420" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Medium (three runs)</text>
  
  <text x="450" y="460" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">May not extrapolate to 100B</text>
  
  <text x="450" y="500" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#006600">Clean isolation of data effects</text>
  
  <text x="450" y="540" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#990000">Scale mismatch with goal</text>
  
  <!-- Column 3 Values -->
  <text x="750" y="340" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">7.5T tokens (3×2.5T) or truncated</text>
  
  <rect x="700" y="365" width="100" height="20" rx="3" ry="3" fill="#ccffcc"/>
  <text x="750" y="380" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">High (controlled)</text>
  
  <rect x="700" y="405" width="100" height="20" rx="3" ry="3" fill="#ffcccc"/>
  <text x="750" y="420" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Complex (3× compute)</text>
  
  <text x="750" y="460" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Correct scale, but budget concerns</text>
  
  <text x="750" y="500" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#006600">Equal compute across branches</text>
  
  <text x="750" y="540" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#990000">Exceeds compute budget</text>
  
  <!-- Vertical separators -->
  <line x1="250" y1="310" x2="250" y2="560" stroke="#333" stroke-width="1"/>
  <line x1="550" y1="310" x2="550" y2="560" stroke="#333" stroke-width="1"/>
</svg>