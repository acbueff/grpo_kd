<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <!-- Background and title -->
  <rect width="800" height="400" fill="#f8f9fa" rx="10" ry="10"/>
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="bold">Sequential Training Flow</text>
  
  <!-- Main flow blocks -->
  <rect x="100" y="100" width="180" height="100" rx="15" ry="15" fill="#7ac142" stroke="#333" stroke-width="2"/>
  <rect x="310" y="100" width="180" height="100" rx="15" ry="15" fill="#ffc845" stroke="#333" stroke-width="2"/>
  <rect x="520" y="100" width="180" height="100" rx="15" ry="15" fill="#ff6b45" stroke="#333" stroke-width="2"/>
  
  <!-- Connecting arrows -->
  <path d="M280,150 L310,150" stroke="#333" stroke-width="3" fill="none"/>
  <polygon points="308,145 318,150 308,155" fill="#333"/>
  
  <path d="M490,150 L520,150" stroke="#333" stroke-width="3" fill="none"/>
  <polygon points="518,145 528,150 518,155" fill="#333"/>
  
  <!-- Block labels -->
  <text x="190" y="145" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold">High Compliance</text>
  <text x="190" y="165" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">(HC Data)</text>
  
  <text x="400" y="145" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold">Medium Compliance</text>
  <text x="400" y="165" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">(MC Data)</text>
  
  <text x="610" y="145" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold">Low Compliance</text>
  <text x="610" y="165" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">(LC Data)</text>
  
  <!-- Token consumption indicators -->
  <text x="190" y="220" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">0 → 0.83T tokens</text>
  <text x="400" y="220" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">0.83T → 1.67T tokens</text>
  <text x="610" y="220" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">1.67T → 2.5T tokens</text>
  
  <!-- Model checkpoint indicators -->
  <circle cx="280" cy="150" r="10" fill="#3a7bd5" stroke="#333"/>
  <text x="280" y="125" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Model-HC</text>
  
  <circle cx="490" cy="150" r="10" fill="#3a7bd5" stroke="#333"/>
  <text x="490" y="125" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Model-MC</text>
  
  <circle cx="700" cy="150" r="10" fill="#3a7bd5" stroke="#333"/>
  <text x="700" y="125" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Model-LC</text>
  
  <!-- Problem highlight box -->
  <rect x="150" y="240" width="500" height="100" rx="10" ry="10" fill="#f8d7da" stroke="#721c24" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="400" y="270" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#721c24">Scientific Challenge: Confounding Variables</text>
  <text x="400" y="300" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#721c24">• Different data distributions across stages</text>
  <text x="400" y="325" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#721c24">• More total training tokens for later stages</text>
  
  <!-- Legend box -->
  <rect x="20" y="340" width="140" height="40" rx="5" ry="5" fill="#eee" stroke="#333" stroke-width="1"/>
  <circle cx="35" cy="360" r="7" fill="#3a7bd5" stroke="#333"/>
  <text x="105" y="365" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Model Checkpoint</text>
</svg>